[package]
name = "kee"
version = "1.7.2"
edition = "2021"
rust-version = "1.86"
description = "AWS CLI profile manager"
authors = ["Stefan Aichholzer <theaichholzer@gmail.com>"]
license = "MIT"
repository = "https://github.com/aichholzer/kee"
keywords = ["aws", "cli", "sso", "session", "manager"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".github/",
    "utilities/",
    "tests/",
    "install.sh",
    "Makefile",
]

[[bin]]
name = "kee"
path = "src/main.rs"

[lib]
name = "kee"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
configparser = "3.0"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
ureq = { version = "2.10", features = ["json"] }
hostname = "0.4"

[dev-dependencies]
tempfile = "3.8"
mockall = "0.12"
serial_test = "3.0"
assert_cmd = "2.0"
predicates = "3.1"

[features]
default = []
integration-tests = []
